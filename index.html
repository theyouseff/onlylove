<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Для тебя 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Montserrat+Alternates:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#e5628a; --pink-2:#f08fae; --pink-soft:#f7c9d8;
    --bg:#fcedf3; --ink:#2b1d22; --muted:#8a7078; --blue:#c3e3f5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    min-height:100dvh; overflow-x:hidden; color:var(--ink);
    font-family:'Comfortaa',system-ui,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #fff 0, transparent 40%),
      radial-gradient(circle at 90% 90%, #f9dbe6 0, transparent 45%),
      var(--bg);
    user-select:none; -webkit-user-select:none;
  }

  /* ---------- декор на фоне ---------- */
  .decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .decor > *{position:absolute;animation:float 7s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  /* ---------- экраны ---------- */
  .stage{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:28px 16px}
  .screen{grid-area:1/1;width:100%;max-width:380px;display:none}
  .screen.active{display:block;animation:enter .7s cubic-bezier(.2,1.2,.4,1) both}
  .screen.leave{display:block;animation:leave .45s ease-in both;pointer-events:none}
  @keyframes enter{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes leave{to{opacity:0;transform:translateY(-20px) scale(.95)}}

  /* волнистая карточка */
  .card{position:relative;padding:46px 30px 44px;text-align:center}
  .card > svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible;
    filter:drop-shadow(0 12px 26px rgba(229,98,138,.20))}
  .card > *:not(.bg){position:relative;z-index:1}

  .art{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
  .art .bob{animation:bob 2.4s ease-in-out infinite}
  .art .bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .art .spark{animation:twinkle 1.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
  .art .rise{animation:rise 2.6s ease-in infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(10px)}25%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}

  h1{font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:25px;line-height:1.22;
     margin:16px 0 24px;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:15px;line-height:1.5;margin:-10px 0 22px}

  .btn{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:18px;color:#fff;border:0;border-radius:999px;
       padding:16px 30px;background:linear-gradient(120deg,#e5628a 0%,#ee84a6 60%,#f3a5bd 100%);
       box-shadow:0 10px 20px rgba(229,98,138,.35), inset 0 -3px 0 rgba(0,0,0,.06);
       cursor:pointer;transition:transform .35s cubic-bezier(.34,1.7,.5,1), box-shadow .2s;touch-action:manipulation}
  .btn.ghost{background:#fff;color:var(--pink);border:2px solid var(--pink-soft);box-shadow:0 6px 14px rgba(229,98,138,.12)}
  .btn.wide{width:100%}
  .sticker{display:block;width:180px;height:auto;margin:0 auto;transform-origin:50% 100%;
           animation:alive 3.2s cubic-bezier(.45,0,.55,1) infinite;will-change:transform}
  /* мягкое «дыхание» + покачивание, как у стикеров в Телеграме */
  @keyframes alive{
    0%,100%{transform:translateY(0) rotate(0) scale(1,1)}
    25%{transform:translateY(-3px) rotate(-2.5deg) scale(1.015,.985)}
    50%{transform:translateY(-6px) rotate(0) scale(.985,1.03)}
    75%{transform:translateY(-3px) rotate(2.5deg) scale(1.015,.985)}
  }

  .swap{display:grid;place-items:end center}
  .swap img{grid-area:1/1;transition:opacity .6s ease}
  .swap img.off{opacity:0}
  .swap img[src$="pan.png"]{width:220px}

  /* «Нет» подмигивает, пока на него не нажали */
  .hint{animation:hint 2.2s ease-in-out infinite}
  @keyframes hint{0%,55%,100%{transform:none}62%{transform:rotate(-7deg) scale(1.06)}69%{transform:rotate(7deg) scale(1.06)}76%{transform:rotate(-5deg)}83%{transform:rotate(4deg)}90%{transform:none}}
  .btn.wide.hint{animation-name:hintx}
  @keyframes hintx{0%,55%,100%{transform:none}62%{transform:translateX(-7px)}69%{transform:translateX(7px)}76%{transform:translateX(-5px)}83%{transform:translateX(4px)}90%{transform:none}}

  .row{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:14px;align-items:stretch}
  .dodge{display:inline-block;position:relative;z-index:5;transition:transform .55s cubic-bezier(.34,1.8,.5,1)}
  .squish{animation:squish .5s ease}
  @keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.25,.75)}60%{transform:scale(.85,1.15)}100%{transform:scale(1)}}
  .tease{min-height:22px;margin-top:18px;color:var(--pink);font-weight:700;font-size:15px}
  .tease.pop{animation:pop .4s ease}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

  /* 3-й вопрос: стрелки и грустный котик */
  .arrows{height:0;margin-bottom:-14px;position:relative;opacity:0;transition:opacity .3s, height .4s ease, margin .4s ease}
  .arrows.show{height:62px;margin-bottom:0;opacity:1}
  .arrows svg{position:absolute;bottom:0;width:46px;height:58px}
  .arrows .a1{left:14%;--rot:-22deg;animation:point .9s ease-in-out infinite}
  .arrows .a2{right:14%;--rot:22deg;animation:point .9s ease-in-out -.45s infinite}
  @keyframes point{0%,100%{transform:rotate(var(--rot)) translateY(-6px)}50%{transform:rotate(var(--rot)) translateY(5px)}}
  .yes-pulse{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 20px rgba(229,98,138,.35)}50%{transform:scale(1.06);box-shadow:0 12px 30px rgba(229,98,138,.6)}}
  .sad{display:none;flex-direction:column;align-items:center}
  .sad.show{display:flex;animation:popin .6s cubic-bezier(.3,1.8,.5,1) both}
  @keyframes popin{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
  .sad svg{width:130px;height:auto}
  .sad .cap{font-size:14px;color:var(--muted);margin-top:4px}
  .tear{animation:tear 1s ease-in infinite;transform-box:fill-box;transform-origin:top center}
  .tear.t2{animation-delay:-.5s}
  @keyframes tear{0%{transform:scaleY(.3);opacity:0}30%{opacity:1}100%{transform:scaleY(1.15) translateY(6px);opacity:0}}
  .shake{animation:shake .5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}

  /* финал */
  .lips{font-size:64px;display:inline-block;margin-top:14px;animation:kiss 1.4s ease-in-out infinite}
  @keyframes kiss{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.2) rotate(6deg)}}
  .final h1{margin-bottom:12px}
  .final .sub{margin:0 0 6px;color:#6f5560;font-size:16px}

  /* стирающийся слой */
  #scratch{position:fixed;inset:0;width:100vw;height:100dvh;z-index:50;touch-action:none;cursor:grab;
           transition:opacity .8s ease}
  #scratch.done{opacity:0;pointer-events:none}

  /* сердечки */
  .fx{position:fixed;pointer-events:none;z-index:60;font-size:22px;will-change:transform,opacity}
  .burst{animation:burst 1s ease-out forwards}
  @keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.6) rotate(var(--rr));opacity:0}}
  .fall{top:-40px;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rr))}}
</style>
</head>
<body>

<div class="decor" aria-hidden="true" id="decor"></div>

<main class="stage">

  <!-- Вопрос 1 -->
  <section class="screen active" id="s1">
    <div class="card">
      <div id="art1"></div>
      <h1 data-text="q1"></h1>
      <div class="row">
        <button class="btn yes" data-next="s2" data-text="q1yes"></button>
        <span class="dodge"><button class="btn ghost no hint" data-text="q1no"></button></span>
      </div>
      <div class="tease"></div>
    </div>
  </section>

  <!-- Вопрос 2 -->
  <section class="screen" id="s2">
    <div class="card">
      <div id="art2"></div>
      <h1 data-text="q2"></h1>
      <div class="row">
        <button class="btn yes" data-next="s3" data-text="q2yes"></button>
        <span class="dodge"><button class="btn ghost no hint" data-text="q2no"></button></span>
      </div>
      <div class="tease"></div>
    </div>
  </section>

  <!-- Вопрос 3 -->
  <section class="screen" id="s3">
    <div class="card">
      <div id="art3"></div>
      <h1 data-text="q3"></h1>
      <div class="col">
        <div class="arrows" id="arrows"></div>
        <button class="btn wide" id="yes3" data-next="s4" data-text="q3yes"></button>
        <button id="no3" class="btn ghost wide hint" data-text="q3no"></button>
        <div class="sad" id="sad">
          <div id="sadArt"></div>
          <div class="cap" data-text="sadCaption"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Финал -->
  <section class="screen final" id="s4">
    <div class="card">
      <div id="art4"></div>
      <h1 data-text="finalTitle"></h1>
      <p class="sub" data-text="finalText"></p>
      <div class="lips">💋</div>
    </div>
  </section>
</main>

<canvas id="scratch"></canvas>

<script>
/* =========================================================
   ТЕКСТЫ — меняй здесь
   ========================================================= */
const TEXT = {
  scratch:     'Сотри меня ✨',
  scratchHint: 'проведи пальцем по экрану',
  scratchColor:'#e5628a',

  q1:    'Любофым, ты выйдешь за меня?',
  q1yes: 'Да',
  q1no:  'Нет',

  q2:    'Твой козёл кожам желает провести с тобой всю оставшуюся жизнь. Ты согласна?',
  q2yes: 'Да, согласна',
  q2no:  'Нет',

  q3:    'Твой кожам тебя сильно, мощно, сочно, точно, восточно любит. Ты простила его?',
  q3yes: 'ДААА!',
  q3no:  'НЕЕТТ!',
  sadCaption: 'кожам плачет… нажми «ДААА!» 🥺',

  finalTitle: 'Ураа! 🎉',
  finalText:  'Моя госпожа простила своего кожам, и кожам скоро заберёт тебя — только дождись 💕',
};
const TEASES = ['Не-а 😜','Мимо!','Попробуй ещё 😏','Никак 🙈','Не поймаешь 😝','Остался только «Да» 💕'];

document.querySelectorAll('[data-text]').forEach(el => el.textContent = TEXT[el.dataset.text]);

/* =========================================================
   КОТИКИ (SVG)
   ========================================================= */
const ST = '#5b3a2c';
function heart(x, y, s = 1, c = '#f06a8a', cls = '') {
  return `<g class="${cls}"><path transform="translate(${x} ${y}) scale(${s})" d="M0 -3 C -5 -13 -19 -8 -13 3 L0 14 L13 3 C 19 -8 5 -13 0 -3Z" fill="${c}" stroke="${ST}" stroke-width="${2/s}" stroke-linejoin="round"/></g>`;
}
function sparkle(x, y, s = 1, c = '#f7c948', delay = 0) {
  return `<g class="spark" style="animation-delay:${delay}s"><path transform="translate(${x} ${y}) scale(${s})" d="M0 -8 Q1 -1 8 0 Q1 1 0 8 Q-1 1 -8 0 Q-1 -1 0 -8Z" fill="${c}"/></g>`;
}
function cat({x = 0, y = 0, s = 1, fur = '#f5a860', stripes = true, face = 'happy', cls = ''} = {}) {
  const sc = '#d9823f', blush = '#ff9fb4';
  const eyesDot = `
    <ellipse cx="42" cy="54" rx="5" ry="6.5" fill="${ST}" stroke="none"/><circle cx="44" cy="51.5" r="2" fill="#fff" stroke="none"/>
    <ellipse cx="78" cy="54" rx="5" ry="6.5" fill="${ST}" stroke="none"/><circle cx="80" cy="51.5" r="2" fill="#fff" stroke="none"/>`;
  const nose = `<path d="M57.5 60 h5 l-2.5 3 z" fill="#f08aa0" stroke-width="1.5"/>`;
  const faces = {
    happy: eyesDot + nose + `<path d="M53 64 q3.5 5 7 0 q3.5 5 7 0" fill="none" stroke-width="2.5"/>`,
    shy: eyesDot + nose + `<path d="M55 65 q2.5 3 5 0 q2.5 3 5 0" fill="none" stroke-width="2.2"/>
      <path d="M26 70 l3 -5 M31 71 l3 -5 M86 71 l3 -5 M91 70 l3 -5" fill="none" stroke="#e86b8a" stroke-width="1.8"/>`,
    closed: `<path d="M35 56 q7 -9 14 0 M71 56 q7 -9 14 0" fill="none"/>` + nose +
      `<path d="M53 64 q7 11 14 0 z" fill="#e8627f" stroke-width="2.2"/>`,
    kiss: `<path d="M35 56 q7 -9 14 0" fill="none"/>
      <ellipse cx="78" cy="54" rx="5" ry="6.5" fill="${ST}" stroke="none"/><circle cx="80" cy="51.5" r="2" fill="#fff" stroke="none"/>` + nose +
      `<path d="M61 63 q7 2 0 5 q7 2 0 5" fill="none" stroke-width="2.5"/>`,
    cry: `<path d="M34 45 L48 39 M86 45 L72 39" fill="none" stroke-width="2.5"/>
      <path d="M36 50 l11 5 l-11 5 M84 50 l-11 5 l11 5" fill="none"/>
      <path class="tear" d="M41 61 q-5 14 -1 32 q7 -2 6 -32 z" fill="#9fdcff" stroke="#4aa8e0" stroke-width="2"/>
      <path class="tear t2" d="M79 61 q5 14 1 32 q-7 -2 -6 -32 z" fill="#9fdcff" stroke="#4aa8e0" stroke-width="2"/>` + nose +
      `<path d="M51 76 q9 -12 18 0 q-9 5 -18 0z" fill="#b3405a" stroke-width="2.2"/>`,
  };
  return `<g class="${cls}"><g transform="translate(${x} ${y}) scale(${s})" stroke="${ST}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M90 124 q30 -2 22 -34" fill="none" stroke-width="11"/>
    <path d="M90 124 q30 -2 22 -34" fill="none" stroke="${fur}" stroke-width="5"/>
    <ellipse cx="60" cy="112" rx="34" ry="28" fill="${fur}"/>
    <ellipse cx="60" cy="118" rx="18" ry="15" fill="#fff8f1" stroke="none"/>
    <ellipse cx="44" cy="137" rx="10" ry="6" fill="${fur}"/><ellipse cx="76" cy="137" rx="10" ry="6" fill="${fur}"/>
    <path d="M22 46 L27 7 L55 28 Z" fill="${fur}"/><path d="M98 46 L93 7 L65 28 Z" fill="${fur}"/>
    <path d="M30 35 L31 17 L45 28Z" fill="#f6b7c3" stroke="none"/><path d="M90 35 L89 17 L75 28Z" fill="#f6b7c3" stroke="none"/>
    <ellipse cx="60" cy="57" rx="46" ry="36" fill="${fur}"/>
    ${stripes ? `<path d="M60 22 v10 M49 24 l3 8 M71 24 l-3 8 M15 55 h8 M16 63 h7 M105 55 h-8 M104 63 h-7" stroke="${sc}" fill="none"/>` : ''}
    <ellipse cx="31" cy="67" rx="7" ry="4" fill="${blush}" stroke="none" opacity=".85"/>
    <ellipse cx="89" cy="67" rx="7" ry="4" fill="${blush}" stroke="none" opacity=".85"/>
    ${faces[face]}
  </g></g>`;
}
const WHITE = {fur: '#ffffff', stripes: false};
const svg = (vb, body) => `<svg class="art" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;

// котики-стикеры
const sticker = src => `<img class="sticker" src="${src}" alt="">`;
document.getElementById('art1').innerHTML = sticker('img/hug.png?v=2');
document.getElementById('art2').innerHTML = sticker('img/bed.png?v=2');
// 3-й вопрос: две картинки сменяют друг друга каждые 3 секунды
document.getElementById('art3').innerHTML =
  `<div class="swap"><img class="sticker" src="img/hug2.png" alt=""><img class="sticker off" src="img/pan.png" alt=""></div>`;
setInterval(() => document.querySelectorAll('#art3 .swap img').forEach(img => img.classList.toggle('off')), 3000);
document.getElementById('art4').innerHTML = sticker('img/kiss.png');

// грустный плачущий котик
document.getElementById('sadArt').innerHTML = `<svg viewBox="0 0 130 150" xmlns="http://www.w3.org/2000/svg">${cat({x: 5, y: 3, face: 'cry', cls: 'shake'})}</svg>`;

// стрелки над «ДААА!»
const arrow = cls => `<svg class="${cls}" viewBox="0 0 46 58"><path d="M23 3 C 12 16, 32 26, 23 44" fill="none" stroke="#e5628a" stroke-width="5" stroke-linecap="round"/><path d="M12 36 L23 52 L34 36" fill="none" stroke="#e5628a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
document.getElementById('arrows').innerHTML = arrow('a1') + arrow('a2');

/* =========================================================
   ВОЛНИСТЫЕ КАРТОЧКИ
   ========================================================= */
function wavyPath(w, h) {
  const amp = 8, ins = amp + 2, W = w - 2 * ins, H = h - 2 * ins;
  const r = Math.min(40, W / 4, H / 4);
  const sT = W - 2 * r, sS = H - 2 * r, arc = Math.PI * r / 2;
  const P = 2 * sT + 2 * sS + 4 * arc;
  const k = Math.max(8, Math.round(P / 95));
  const N = Math.ceil(P / 3);
  const pt = d => {
    if (d < sT) return [r + d, 0, 0, -1]; d -= sT;
    if (d < arc) { const a = -Math.PI / 2 + d / r; return [W - r + r * Math.cos(a), r + r * Math.sin(a), Math.cos(a), Math.sin(a)]; } d -= arc;
    if (d < sS) return [W, r + d, 1, 0]; d -= sS;
    if (d < arc) { const a = d / r; return [W - r + r * Math.cos(a), H - r + r * Math.sin(a), Math.cos(a), Math.sin(a)]; } d -= arc;
    if (d < sT) return [W - r - d, H, 0, 1]; d -= sT;
    if (d < arc) { const a = Math.PI / 2 + d / r; return [r + r * Math.cos(a), H - r + r * Math.sin(a), Math.cos(a), Math.sin(a)]; } d -= arc;
    if (d < sS) return [0, H - r - d, -1, 0]; d -= sS;
    const a = Math.PI + d / r; return [r + r * Math.cos(a), r + r * Math.sin(a), Math.cos(a), Math.sin(a)];
  };
  let out = '';
  for (let i = 0; i < N; i++) {
    const s = i / N * P, [x, y, nx, ny] = pt(s), o = amp * Math.sin(2 * Math.PI * k * s / P);
    out += (i ? 'L' : 'M') + (ins + x + nx * o).toFixed(1) + ' ' + (ins + y + ny * o).toFixed(1);
  }
  return out + 'Z';
}
document.querySelectorAll('.card').forEach(card => {
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  bg.classList.add('bg');
  bg.innerHTML = '<path fill="#fff"/>';
  card.prepend(bg);
  new ResizeObserver(() => {
    const w = card.offsetWidth, h = card.offsetHeight;
    if (!w || !h) return;
    bg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    bg.firstChild.setAttribute('d', wavyPath(w, h));
  }).observe(card);
});

/* =========================================================
   ДЕКОР
   ========================================================= */
(() => {
  const decor = document.getElementById('decor');
  const cloud = c => `<svg width="70" height="50" viewBox="0 0 70 50"><path d="M18 40 a12 12 0 0 1 -2 -24 a15 15 0 0 1 28 -6 a12 12 0 0 1 16 14 a9 9 0 0 1 -4 16 z" fill="${c}"/></svg>`;
  const items = [
    [cloud('#c3e3f5'), '6%', '8%', 0], [cloud('#c3e3f5'), '78%', '14%', -2], [cloud('#e6dcfb'), '84%', '72%', -4],
    ['<span style="font-size:22px">💗</span>', '10%', '78%', -1], ['<span style="font-size:18px">✨</span>', '88%', '42%', -3],
    ['<span style="font-size:16px">💕</span>', '4%', '44%', -5], ['<span style="font-size:20px">🌸</span>', '70%', '90%', -2.5],
  ];
  items.forEach(([html, l, t, d]) => {
    const el = document.createElement('div');
    el.innerHTML = html; el.style.left = l; el.style.top = t; el.style.animationDelay = d + 's';
    decor.appendChild(el);
  });
})();

/* =========================================================
   ЭФФЕКТЫ: сердечки
   ========================================================= */
const HEARTS = ['💗', '💖', '💕', '💞', '❤️', '✨'];
function burst(x, y, n = 14) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span');
    el.className = 'fx burst';
    el.textContent = HEARTS[i % HEARTS.length];
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    el.style.left = x - 11 + 'px'; el.style.top = y - 11 + 'px';
    el.style.setProperty('--dx', Math.cos(a) * d + 'px');
    el.style.setProperty('--dy', Math.sin(a) * d - 40 + 'px');
    el.style.setProperty('--rr', (Math.random() * 80 - 40) + 'deg');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
}
function heartRain() {
  setInterval(() => {
    const el = document.createElement('span');
    el.className = 'fx fall';
    el.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = 14 + Math.random() * 18 + 'px';
    el.style.animationDuration = 4 + Math.random() * 4 + 's';
    el.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    el.style.setProperty('--rr', (Math.random() * 360) + 'deg');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 9000);
  }, 260);
}

/* =========================================================
   ПЕРЕХОДЫ
   ========================================================= */
function go(id) {
  const cur = document.querySelector('.screen.active');
  cur.classList.remove('active'); cur.classList.add('leave');
  setTimeout(() => {
    cur.classList.remove('leave');
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
    if (id === 's4') heartRain();
  }, 420);
}
document.querySelectorAll('[data-next]').forEach(btn => btn.addEventListener('click', e => {
  burst(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2);
  go(btn.dataset.next);
}));

/* =========================================================
   УБЕГАЮЩАЯ КНОПКА «НЕТ» (вопросы 1 и 2)
   вверх → вниз → вправо → … потом случайно
   ========================================================= */
const MOVES = [[0, -120], [0, 120], [130, 0], [-130, -40], [90, 130], [-110, 110], [0, -150]];
document.querySelectorAll('.dodge').forEach(wrap => {
  const btn = wrap.querySelector('.no');
  const card = wrap.closest('.card');
  const yes = card.querySelector('.yes');
  const tease = card.querySelector('.tease');
  let step = 0, tx = 0, ty = 0, lastT = 0;

  function dodge(e) {
    e.preventDefault();
    btn.classList.remove('hint');
    const now = Date.now();
    if (now - lastT < 250) return; // pointerdown + click от одного тапа
    lastT = now;
    const [dx, dy] = step < MOVES.length ? MOVES[step]
      : [(Math.random() * 2 - 1) * 150, (Math.random() * 2 - 1) * 170];
    const r = wrap.getBoundingClientRect();
    const baseL = r.left - tx, baseT = r.top - ty, m = 14;
    const clampL = v => Math.min(Math.max(v, m), innerWidth - r.width - m);
    const clampT = v => Math.min(Math.max(v, m), innerHeight - r.height - m);
    let nl = clampL(r.left + dx), nt = clampT(r.top + dy);
    // упёрлись в край — прыгаем в обратную сторону
    if (Math.hypot(nl - r.left, nt - r.top) < 50) { nl = clampL(r.left - dx); nt = clampT(r.top - dy); }
    tx = nl - baseL; ty = nt - baseT;
    wrap.style.transform = `translate(${tx}px, ${ty}px)`;
    btn.classList.remove('squish'); void btn.offsetWidth; btn.classList.add('squish');

    tease.textContent = TEASES[Math.min(step, TEASES.length - 1)];
    tease.classList.remove('pop'); void tease.offsetWidth; tease.classList.add('pop');
    yes.style.transform = `scale(${Math.min(1 + (step + 1) * 0.07, 1.4)})`;
    step++;
  }
  btn.addEventListener('pointerdown', dodge);
  btn.addEventListener('click', dodge);
});

/* =========================================================
   ВОПРОС 3: «НЕЕТТ!» → плачущий котик + стрелки
   ========================================================= */
document.getElementById('no3').addEventListener('click', () => {
  document.getElementById('no3').style.display = 'none';
  document.getElementById('sad').classList.add('show');
  document.getElementById('arrows').classList.add('show');
  document.getElementById('yes3').classList.add('yes-pulse');
});

/* =========================================================
   «СОТРИ МЕНЯ»
   ========================================================= */
(async () => {
  const cv = document.getElementById('scratch');
  const ctx = cv.getContext('2d', {willReadFrequently: true});
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let started = false, drawing = false, last = null, moves = 0, finished = false;

  function paint() {
    const W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = TEXT.scratchColor;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    for (let i = 0; i < 70; i++) {
      ctx.beginPath(); ctx.arc(Math.random() * W, Math.random() * H, Math.random() * 2.2 + .5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${Math.min(34, W / 11)}px Comfortaa, sans-serif`;
    ctx.fillText(TEXT.scratch, W / 2, H / 2);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.font = `600 15px Comfortaa, sans-serif`;
    ctx.fillText(TEXT.scratchHint + ' 👆', W / 2, H / 2 + 44);
  }
  paint();
  addEventListener('resize', () => { if (!started) paint(); });
  try { await document.fonts.load('700 30px Comfortaa'); if (!started) paint(); } catch (_) {}

  function line(a, b) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 56; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function cleared() {
    const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let clear = 0, total = 0;
    for (let i = 3; i < data.length; i += 4 * 24) { total++; if (data[i] === 0) clear++; }
    return clear / total;
  }
  function check() {
    if (!finished && cleared() > 0.5) {
      finished = true;
      cv.classList.add('done');
      burst(innerWidth / 2, innerHeight / 2, 20);
      setTimeout(() => cv.remove(), 900);
    }
  }
  cv.addEventListener('pointerdown', e => {
    drawing = true; started = true; last = {x: e.clientX, y: e.clientY};
    cv.setPointerCapture(e.pointerId);
    line(last, {x: last.x + .1, y: last.y + .1});
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = {x: e.clientX, y: e.clientY};
    line(last, p); last = p;
    if (++moves % 25 === 0) check();
  });
  const end = () => { if (drawing) { drawing = false; check(); } };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
})();
</script>
